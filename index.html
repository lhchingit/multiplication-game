<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九乘法大冒險</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1 class="title">九九乘法<br>大冒險</h1>
            <div class="high-score-display">最高分: <span id="high-score">0</span></div>
            <div class="mascot-container">
                <div class="mascot">🦁</div>
            </div>
            <div class="difficulty-container">
                <p class="diff-label">選擇難度</p>
                <div class="diff-buttons">
                    <button class="diff-btn active" data-level="easy">簡單</button>
                    <button class="diff-btn" data-level="medium">中等</button>
                    <button class="diff-btn" data-level="hard">困難</button>
                    <button class="diff-btn" data-level="master">大師</button>
                </div>
            </div>
            <button id="start-btn" class="btn primary-btn">開始遊戲</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <div class="header">
                <button id="game-home-btn" class="icon-btn" aria-label="回首頁">🏠</button>
                <div class="score-box">分數: <span id="score">0</span></div>
                <button id="game-restart-btn" class="icon-btn" aria-label="重新開始">↻</button>
                <div class="timer-box">時間: <span id="timer">60</span>s</div>
            </div>

            <div class="question-container">
                <div class="question-card">
                    <span id="factor1">?</span>
                    <span class="operator">×</span>
                    <span id="factor2">?</span>
                    <span class="equals">=</span>
                    <span id="answer-placeholder">?</span>
                </div>
            </div>

            <div class="input-area">
                <div class="answer-display" id="user-input"></div>
                <div class="numpad">
                    <button class="num-btn" data-val="1">1</button>
                    <button class="num-btn" data-val="2">2</button>
                    <button class="num-btn" data-val="3">3</button>
                    <button class="num-btn" data-val="4">4</button>
                    <button class="num-btn" data-val="5">5</button>
                    <button class="num-btn" data-val="6">6</button>
                    <button class="num-btn" data-val="7">7</button>
                    <button class="num-btn" data-val="8">8</button>
                    <button class="num-btn" data-val="9">9</button>
                    <button class="num-btn action-btn" id="clear-btn">C</button>
                    <button class="num-btn" data-val="0">0</button>
                    <button class="num-btn action-btn" id="submit-btn">OK</button>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <h2>遊戲結束!</h2>
            <div class="final-score-box">
                <p>你的得分</p>
                <div id="final-score">0</div>
            </div>
            <div id="stars-container">
                <!-- Stars will be injected here -->
            </div>
            <p id="feedback-text">太棒了！</p>
            <div class="result-buttons">
                <button id="result-home-btn" class="btn secondary-btn">回首頁</button>
                <button id="restart-btn" class="btn primary-btn">再玩一次</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
